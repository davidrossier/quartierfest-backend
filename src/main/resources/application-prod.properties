# CORS
cors.allowed-origins=https://davidrossier.ch

# JWT – issuer-uri vom IdP (Auth0 oder Supabase) eintragen
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://DEIN_TENANT.auth0.com/

# Datenbank – via Umgebungsvariablen injizieren
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Logging
spring.jpa.show-sql=false
