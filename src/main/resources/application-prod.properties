# CORS
cors.allowed-origins=https://davidrossier.ch

# Auth (AUTH-002, Eigenbau-Login) – via Umgebungsvariablen injizieren
# AUTH_JWT_SECRET: mindestens 32 Zeichen (HS256)
auth.jwt.secret=${AUTH_JWT_SECRET}
auth.bootstrap.email=${AUTH_INITIAL_ADMIN_EMAIL}
auth.bootstrap.password=${AUTH_INITIAL_ADMIN_PASSWORD}

# Datenbank – via Umgebungsvariablen injizieren
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# SEC-002: Client-IP für die Login-Drosselung. Tomcat übernimmt X-Forwarded-For nur von Proxys
# aus privaten Netzen (RemoteIpValve, internal-proxies) – ohne Proxy bleibt getRemoteAddr() die echte Client-IP.
server.forward-headers-strategy=native

# Logging
spring.jpa.show-sql=false
