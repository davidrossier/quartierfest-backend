spring.application.name=backend
spring.datasource.url=jdbc:postgresql://localhost:5432/quartierfest
spring.datasource.username=qfuser
spring.datasource.password=qfpass
# DB-001: Schema wird ausschliesslich via Flyway-Migrationen (db/migration) verwaltet;
# Hibernate validiert nur noch, dass Entities und Schema zusammenpassen.
spring.jpa.hibernate.ddl-auto=validate
# Bestehende, von Hibernate erzeugte DBs (lokale Dev-DB, Prod) werden beim ersten Start
# auf V1 baselined; ab V2 laufen die Migrationen normal. Leere DBs (CI) bauen V1+V2 auf.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Hibernate-Schema vor Flyway (DB-001)
spring.jpa.show-sql=true
cors.allowed-origins=http://localhost:4200

# Auth (AUTH-002, Eigenbau-Login) — Dev-Defaults; prod überschreibt via Umgebungsvariablen
auth.jwt.secret=dev-secret-quartierfest-mindestens-32-zeichen!
auth.jwt.ttl-stunden=12
auth.bootstrap.email=admin@quartierfest.local
auth.bootstrap.password=quartierfest-admin

# SEC-002: Brute-Force-Drosselung auf POST /api/auth/login (In-Memory, pro E-Mail und pro Client-IP; 0 = aus)
auth.drosselung.max-fehlversuche-email=5
auth.drosselung.max-fehlversuche-ip=20
auth.drosselung.sperre-minuten=15

# OPS-001/CI-001: Actuator – nur /actuator/health über HTTP exponieren (Readiness für E2E-CI und Betrieb), keine Details
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# API-001: OpenAPI-Spec (/v3/api-docs) und Swagger-UI (/swagger-ui.html); Ausgabe deterministisch für den Contract-Abgleich (OpenApiContractIT)
springdoc.writer-with-order-by-keys=true
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

# API-001 Stufe 2: unbekannte Felder im Request (z.B. id im POST, Referenz im Update-Request) → 400 statt stillem Ignorieren
spring.jackson.deserialization.fail-on-unknown-properties=true
# API-001 Stufe 2: null-Felder in Responses weglassen — im Contract sind nullbare Felder optional (OpenApiConfig, E7)
spring.jackson.default-property-inclusion=non_null
